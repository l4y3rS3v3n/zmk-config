# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Enable Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_PM_SOFT_OFF=y

# 15 minute sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery % Reporting
# CONFIG_ZMK_BATTERY_REPORTING=n

# Bluetooth Configs
# CONFIG_BT_MAX_CONN=2
# CONFIG_BT_MAX_PAIRED=2

# Custom Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Corne Wired"



# Disables Dog (Luna) animation

CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n

# Disable displaying which key modifiers are active (Caps, Num Lock etc)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

